# Betwright Playwright tests – grouped animations and scheduled email

name: Betwright Tests

# One Betwright run per branch at a time: re-dispatch cancels a stuck/duplicate run instead of piling up in the queue.
concurrency:
  group: betwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Betwright runs – 21:30 UK (currently UTC)
    - cron: '30 21 * * *'
    # Test run: 15:00 UK
    - cron: '0 15 * * *'

jobs:
  betwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install xvfb -y
      - name: Run Betwright tests
        id: run_tests
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run test:betwright 2>&1 | tee test-output.log
      - name: Ensure email reflects failed Betwright run
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.run_tests.outcome == 'failure'
        run: node scripts/betwright-email-sync-job-failure.cjs
      - name: Send email report
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/email-report.cjs --site=Betwright --report=test-results/email-report.json
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-betwright
          path: playwright-report
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-betwright
          path: |
            test-results
            test-results-html

