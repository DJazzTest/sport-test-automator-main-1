name: Cleanup Workflow Runs

on:
  workflow_run:
    workflows:
      - Playwright TeamTalk
      - Playwright PlanetF1
      - Playwright PlanetRugby
      - Playwright PlanetSports
      - Playwright StarSports
      - Playwright DragonBet
      - Playwright DragonSports
      - Playwright Vodacom
      - Playwright Core Sites
      - Playwright Selectable
      - Playwright LoveRugbyLeague
      - Playwright Betwright
      - CI
    types:
      - completed
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs in batches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Keep newest 100 runs; delete older ones.
            const KEEP_RECENT = 100;
            // Safety cap per execution to avoid long/expensive runs.
            const MAX_DELETE_PER_RUN = 100;

            const allRuns = [];
            let page = 1;

            while (true) {
              const res = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });

              const runs = res.data.workflow_runs || [];
              if (!runs.length) break;

              allRuns.push(...runs);
              if (runs.length < 100) break;
              page += 1;
            }

            core.info(`Total workflow runs found: ${allRuns.length}`);

            if (allRuns.length <= KEEP_RECENT) {
              core.info(`No cleanup required (<= ${KEEP_RECENT} runs).`);
              return;
            }

            const runsToDelete = allRuns
              .slice(KEEP_RECENT)
              .slice(0, MAX_DELETE_PER_RUN);

            core.info(`Deleting ${runsToDelete.length} run(s) this cycle (batch cap ${MAX_DELETE_PER_RUN}).`);

            let deleted = 0;
            for (const run of runsToDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
              } catch (err) {
                core.warning(`Failed to delete run ${run.id}: ${err.message}`);
              }
            }

            core.info(`Deleted ${deleted} run(s).`);
            core.info(`Estimated runs remaining after this job: ${Math.max(allRuns.length - deleted, 0)}.`);
