# Run one Playwright spec from the dashboard (test_path + site_name inputs)

name: Run single Playwright spec

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Spec path relative to repo root"
        required: true
        type: string
      site_name:
        description: "Dashboard test name for report matching"
        required: true
        type: string

concurrency:
  group: run-spec-${{ github.ref }}-${{ inputs.test_path }}
  cancel-in-progress: true

jobs:
  run-spec:
    # DragonBet is UK-only — set repo variable DRAGONBET_RUNS_ON=self-hosted (Mac UK runner).
    runs-on: ${{ contains(github.event.inputs.test_path, 'dragonbet') && (vars.DRAGONBET_RUNS_ON || 'self-hosted') || 'ubuntu-latest' }}
    env:
      DRAGONBET_REPORT_SITE: ${{ inputs.site_name }}
      PLAYWRIGHT_QUICK: "1"
      MAX_EVENTS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run spec
        env:
          HTTP_PROXY: ${{ secrets.DRAGONBET_UK_PROXY }}
          HTTPS_PROXY: ${{ secrets.DRAGONBET_UK_PROXY }}
        run: |
          set -o pipefail
          SPEC="${{ inputs.test_path }}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
              npx playwright test "$SPEC" --retries=0 2>&1 | tee test-output.log
          else
            npx playwright test "$SPEC" --retries=0 2>&1 | tee test-output.log
          fi
      - name: Notify PlanetSport dashboard
        if: always()
        continue-on-error: true
        env:
          DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.DASHBOARD_WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/notify-dashboard.cjs --site="${{ inputs.site_name }}" --report=test-results/email-report.json
      - name: Sync email report from JUnit when job failed without details
        if: always()
        run: node scripts/sync-email-report-job-failure.cjs --site="${{ inputs.site_name }}"
      - name: Send email report (failures only)
        if: failure()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/email-report.cjs --site="${{ inputs.site_name }}" --report=test-results/email-report.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-run-spec
          path: |
            test-results
            playwright-report
