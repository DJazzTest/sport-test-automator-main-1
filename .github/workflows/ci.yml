# Run each Playwright project in its own job so "Golf365 Tests" runs only Golf365,
# and labels always match what actually ran (no more wrong-file / all-tests-at-once).
name: Playwright Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Golf365 Tests
          - Cricket365 Tests
          - Football365 Tests
          - PlanetFootball Tests
          - Other Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install xvfb -y
      - name: Run ${{ matrix.project }}
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test --project "${{ matrix.project }}"
      - name: Send email report
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/email-report.cjs --site="${{ matrix.project }}" --report=test-results/email-report.json
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: test-results-html
      - name: Upload JUnit and HTML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            test-results
            test-results-html
  post-deploy:
    name: Post-deployment check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Netlify site live
        run: curl -sSf https://animationsautamation.netlify.app > /dev/null
