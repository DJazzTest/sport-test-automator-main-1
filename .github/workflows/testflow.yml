name: TestFlow Run

on:
  repository_dispatch:
    types: [testflow-run]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.branch }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Fetch test configuration
        run: |
          curl -s "${{ github.event.client_payload.api_url }}/functions/v1/get-test-run?run_id=${{ github.event.client_payload.run_id }}" \
            -o test-config.json
      
      - name: Run Tests
        run: |
          TEST_PATHS=$(cat test-config.json | jq -r '.selected_tests[].file_path' | tr '\n' ' ')
          npx playwright test $TEST_PATHS --reporter=json > test-results.json || true
      
      - name: Upload Results
        if: always()
        run: |
          if [ -f test-results.json ]; then
            curl -X POST "${{ github.event.client_payload.api_url }}/functions/v1/upload-test-results" \
              -H "Content-Type: application/json" \
              -d "{\"runId\": \"${{ github.event.client_payload.run_id }}\", \"results\": $(cat test-results.json)}"
          fi
