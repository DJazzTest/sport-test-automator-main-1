# Run a selected Playwright test via npm script

name: Playwright Selectable

on:
  workflow_dispatch:
    inputs:
      npm_script:
        description: "Choose an npm test script to run"
        type: choice
        required: true
        default: test:all
        options:
          - test:all
          - test:planetf1
          - test:planetrugby
          - test:teamtalk
          - test:planetsports
          - test:starsports
          - test:vodacom
          - test:dragonbet
          - test:cricket
          - test:football
          - test:tennis
          - test:nfl
          - test:starsports:cricket
          - test:starsports:football
          - test:starsports:tennis
          - test:starsports:nfl
          - test:vodacom:comprehensive
          - test:vodacom:quick
      test_path:
        description: "Optional: run a specific spec.ts path (overrides npm_script)"
        type: string
        required: false
        default: ""
      extra_args:
        description: "Optional Playwright args (e.g. --headed)"
        type: string
        required: false
        default: ""

jobs:
  run-selected-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install xvfb -y
      - name: Run selected test
        run: |
          if [ -n "${{ inputs.test_path }}" ]; then
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }} ${{ inputs.extra_args }}
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }}
            fi
          else
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }} -- ${{ inputs.extra_args }}
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }}
            fi
          fi
      - name: Check email secrets
        if: always() && inputs.npm_script == 'test:planetf1'
        id: check_email
        continue-on-error: true
        run: |
          echo "🔍 Checking for email secrets..."
          MISSING=""
          FOUND=""
          
          if [ -n "${{ secrets.SMTP_SERVER }}" ]; then
            FOUND="${FOUND}SMTP_SERVER "
          else
            MISSING="${MISSING}SMTP_SERVER "
          fi
          
          if [ -n "${{ secrets.SMTP_PORT }}" ]; then
            FOUND="${FOUND}SMTP_PORT "
          else
            MISSING="${MISSING}SMTP_PORT "
          fi
          
          if [ -n "${{ secrets.SMTP_USERNAME }}" ]; then
            FOUND="${FOUND}SMTP_USERNAME "
          else
            MISSING="${MISSING}SMTP_USERNAME "
          fi
          
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            FOUND="${FOUND}SMTP_PASSWORD "
          else
            MISSING="${MISSING}SMTP_PASSWORD "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_TO }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_TO "
          else
            MISSING="${MISSING}ALERT_EMAIL_TO "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_FROM }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_FROM "
          else
            MISSING="${MISSING}ALERT_EMAIL_FROM "
          fi
          
          echo "Found secrets: ${FOUND:-none}"
          echo "Missing secrets: ${MISSING:-none}"
          
          if [ -n "$MISSING" ]; then
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️ Email notification will be skipped. Missing secrets: $MISSING"
            echo ""
            echo "📋 To add secrets:"
            echo "   1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "   2. Click 'New repository secret'"
            echo "   3. Add each secret with EXACT name (case-sensitive):"
            echo "      - SMTP_SERVER = smtp.gmail.com"
            echo "      - SMTP_PORT = 587"
            echo "      - SMTP_USERNAME = your-email@gmail.com"
            echo "      - SMTP_PASSWORD = your-app-password (no spaces)"
            echo "      - ALERT_EMAIL_TO = recipient@example.com"
            echo "      - ALERT_EMAIL_FROM = your-email@gmail.com"
            echo ""
            echo "⚠️ Make sure secrets are in 'Repository secrets' (not Environment secrets)"
          else
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
            echo "✅ All 6 email secrets are configured and ready"
          fi
      - name: Get test results summary
        if: always() && inputs.npm_script == 'test:planetf1' && steps.check_email.outputs.secrets_configured == 'true'
        id: test_results
        continue-on-error: true
        run: |
          RESULTS_FILE="test-results/junit.xml"
          if [ -f "$RESULTS_FILE" ]; then
            echo "📊 Parsing test results from $RESULTS_FILE"
            
            # Extract test counts from junit.xml
            TOTAL=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$RESULTS_FILE" | head -1 || echo "0")
            FAILED=$(sed -n 's/.*failures="\([0-9]*\)".*/\1/p' "$RESULTS_FILE" | head -1 || echo "0")
            SKIPPED=$(sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' "$RESULTS_FILE" | head -1 || echo "0")
            
            # Calculate passed tests
            if [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
              TOTAL="0"
              PASSED="0"
            else
              PASSED=$((TOTAL - FAILED - SKIPPED))
            fi
            
            # Extract individual test names and their status
            PASSED_TESTS=""
            FAILED_TESTS=""
            
            # Extract passed tests (testcase without failure/skipped)
            PASSED_TESTS=$(grep -o '<testcase[^>]*name="[^"]*"[^>]*>' "$RESULTS_FILE" | grep -v 'failure\|skipped\|error' | sed -n 's/.*name="\([^"]*\)".*/\1/p' | head -10 | sed 's/^/✅ /' | tr '\n' '|' || echo "")
            
            # Extract failed tests
            FAILED_TESTS=$(grep -A 1 '<testcase[^>]*>' "$RESULTS_FILE" | grep -B 1 '<failure\|<error' | grep 'name=' | sed -n 's/.*name="\([^"]*\)".*/\1/p' | head -10 | sed 's/^/❌ /' | tr '\n' '|' || echo "")
            
            echo "✅ Found test results: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"
            
            echo "test_total=$TOTAL" >> $GITHUB_OUTPUT
            echo "test_passed=$PASSED" >> $GITHUB_OUTPUT
            echo "test_failed=$FAILED" >> $GITHUB_OUTPUT
            echo "test_skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "passed_tests<<EOF" >> $GITHUB_OUTPUT
            echo "$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "failed_tests<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Test results file not found at $RESULTS_FILE"
            echo "test_total=0" >> $GITHUB_OUTPUT
            echo "test_passed=0" >> $GITHUB_OUTPUT
            echo "test_failed=0" >> $GITHUB_OUTPUT
            echo "test_skipped=0" >> $GITHUB_OUTPUT
            echo "passed_tests=" >> $GITHUB_OUTPUT
            echo "failed_tests=" >> $GITHUB_OUTPUT
          fi
      - name: Send email for PlanetF1 run
        if: always() && inputs.npm_script == 'test:planetf1' && steps.check_email.outputs.secrets_configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "PlanetF1 Playwright Test – ${{ job.status }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: false
          content_type: text/html
          body: |
            <html>
            <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
              <h2 style="color: ${{ job.status == 'success' && '#28a745' || '#dc3545' }};">PlanetF1 Playwright Test Results</h2>
              
              <p><strong>Status:</strong> <span style="color: ${{ job.status == 'success' && '#28a745' || '#dc3545' }}; font-weight: bold;">${{ job.status }}</span></p>
              
              <h3>Test Summary</h3>
              <table style="border-collapse: collapse; width: 100%; margin: 10px 0;">
                <tr style="background-color: #f8f9fa;">
                  <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Metric</th>
                  <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Count</th>
                </tr>
                <tr>
                  <td style="border: 1px solid #ddd; padding: 8px;"><strong>Total Tests</strong></td>
                  <td style="border: 1px solid #ddd; padding: 8px;">${{ steps.test_results.outputs.test_total || '0' }}</td>
                </tr>
                <tr style="background-color: #d4edda;">
                  <td style="border: 1px solid #ddd; padding: 8px;"><strong>Passed</strong></td>
                  <td style="border: 1px solid #ddd; padding: 8px; color: #28a745; font-weight: bold;">${{ steps.test_results.outputs.test_passed || '0' }}</td>
                </tr>
                <tr style="background-color: #f8d7da;">
                  <td style="border: 1px solid #ddd; padding: 8px;"><strong>Failed</strong></td>
                  <td style="border: 1px solid #ddd; padding: 8px; color: #dc3545; font-weight: bold;">${{ steps.test_results.outputs.test_failed || '0' }}</td>
                </tr>
                <tr>
                  <td style="border: 1px solid #ddd; padding: 8px;"><strong>Skipped</strong></td>
                  <td style="border: 1px solid #ddd; padding: 8px;">${{ steps.test_results.outputs.test_skipped || '0' }}</td>
                </tr>
              </table>
              
              <h3>Workflow Details</h3>
              <ul>
                <li><strong>Repository:</strong> ${{ github.repository }}</li>
                <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                <li><strong>Commit:</strong> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></li>
                <li><strong>Workflow Run:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Run #${{ github.run_id }}</a></li>
              </ul>
              
              <h3>📊 Full Test Report & Artifacts</h3>
              <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; margin: 15px 0; border-left: 4px solid #007bff;">
                <p style="margin: 0 0 15px 0; font-size: 16px;"><strong>📥 Download Complete Test Report</strong></p>
                <p style="margin: 0 0 15px 0;">
                  The full HTML test report includes detailed test results, screenshots, videos, and execution traces.
                </p>
                <p style="margin: 0 0 15px 0;">
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                     style="background-color: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; font-size: 14px;">
                    🔗 View Test Report & Download Artifacts
                  </a>
                </p>
                <p style="margin: 15px 0 0 0; color: #666; font-size: 13px;">
                  <strong>Steps to download:</strong><br>
                  1. Click the button above to open the workflow run<br>
                  2. Scroll down to the "Artifacts" section<br>
                  3. Click "playwright-report" to download the HTML report<br>
                  4. Open the downloaded HTML file in your browser to view full test details
                </p>
              </div>
              
              <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
              <p style="color: #666; font-size: 12px;">This is an automated notification from GitHub Actions.</p>
            </body>
            </html>
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
