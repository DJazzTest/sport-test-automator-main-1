# Run a selected Playwright test via npm script

name: Playwright Selectable

on:
  workflow_dispatch:
    inputs:
      npm_script:
        description: "Choose an npm test script to run"
        type: choice
        required: true
        default: test:all
        options:
          - test:all
          - test:planetf1
          - test:planetrugby
          - test:teamtalk
          - test:planetsports
          - test:starsports
          - test:vodacom
          - test:dragonbet
          - test:cricket
          - test:football
          - test:tennis
          - test:nfl
          - test:starsports:cricket
          - test:starsports:football
          - test:starsports:tennis
          - test:starsports:nfl
          - test:vodacom:comprehensive
          - test:vodacom:quick
      test_path:
        description: "Optional: run a specific spec.ts path (overrides npm_script)"
        type: string
        required: false
        default: ""
      extra_args:
        description: "Optional Playwright args (e.g. --headed)"
        type: string
        required: false
        default: ""

jobs:
  run-selected-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install xvfb -y
      - name: Run selected test
        run: |
          if [ -n "${{ inputs.test_path }}" ]; then
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }} ${{ inputs.extra_args }}
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }}
            fi
          else
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }} -- ${{ inputs.extra_args }}
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }}
            fi
          fi
      - name: Check email secrets
        if: always() && inputs.npm_script == 'test:planetf1'
        id: check_email
        continue-on-error: true
        run: |
          echo "🔍 Checking for email secrets..."
          MISSING=""
          FOUND=""
          
          if [ -n "${{ secrets.SMTP_SERVER }}" ]; then
            FOUND="${FOUND}SMTP_SERVER "
          else
            MISSING="${MISSING}SMTP_SERVER "
          fi
          
          if [ -n "${{ secrets.SMTP_PORT }}" ]; then
            FOUND="${FOUND}SMTP_PORT "
          else
            MISSING="${MISSING}SMTP_PORT "
          fi
          
          if [ -n "${{ secrets.SMTP_USERNAME }}" ]; then
            FOUND="${FOUND}SMTP_USERNAME "
          else
            MISSING="${MISSING}SMTP_USERNAME "
          fi
          
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            FOUND="${FOUND}SMTP_PASSWORD "
          else
            MISSING="${MISSING}SMTP_PASSWORD "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_TO }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_TO "
          else
            MISSING="${MISSING}ALERT_EMAIL_TO "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_FROM }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_FROM "
          else
            MISSING="${MISSING}ALERT_EMAIL_FROM "
          fi
          
          echo "Found secrets: ${FOUND:-none}"
          echo "Missing secrets: ${MISSING:-none}"
          
          if [ -n "$MISSING" ]; then
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️ Email notification will be skipped. Missing secrets: $MISSING"
            echo ""
            echo "📋 To add secrets:"
            echo "   1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "   2. Click 'New repository secret'"
            echo "   3. Add each secret with EXACT name (case-sensitive):"
            echo "      - SMTP_SERVER = smtp.gmail.com"
            echo "      - SMTP_PORT = 587"
            echo "      - SMTP_USERNAME = your-email@gmail.com"
            echo "      - SMTP_PASSWORD = your-app-password (no spaces)"
            echo "      - ALERT_EMAIL_TO = recipient@example.com"
            echo "      - ALERT_EMAIL_FROM = your-email@gmail.com"
            echo ""
            echo "⚠️ Make sure secrets are in 'Repository secrets' (not Environment secrets)"
          else
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
            echo "✅ All 6 email secrets are configured and ready"
          fi
      - name: Send email for PlanetF1 run
        if: always() && inputs.npm_script == 'test:planetf1' && steps.check_email.outputs.secrets_configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "PlanetF1 Playwright Test – ${{ job.status }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: false
          body: |
            PlanetF1 test run finished with status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            View the test report in the workflow artifacts.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
