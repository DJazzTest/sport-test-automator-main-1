# Run a selected Playwright test via npm script

name: Playwright Selectable

on:
  workflow_dispatch:
    inputs:
      npm_script:
        description: "Choose an npm test script to run"
        type: choice
        required: true
        default: test:all
        options:
          - test:all
          - test:planetf1
          - test:planetrugby
          - test:teamtalk
          - test:planetsports
          - test:starsports
          - test:vodacom
          - test:dragonbet
          - test:cricket
          - test:football
          - test:tennis
          - test:nfl
          - test:starsports:cricket
          - test:starsports:football
          - test:starsports:tennis
          - test:starsports:nfl
          - test:vodacom:comprehensive
          - test:vodacom:quick
      test_path:
        description: "Optional: run a specific spec.ts path (overrides npm_script)"
        type: string
        required: false
        default: ""
      extra_args:
        description: "Optional Playwright args (e.g. --headed)"
        type: string
        required: false
        default: ""

jobs:
  run-selected-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install xvfb -y
      - name: Run selected test
        run: |
          if [ -n "${{ inputs.test_path }}" ]; then
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }} ${{ inputs.extra_args }} 2>&1 | tee test-output.log
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npx playwright test ${{ inputs.test_path }} 2>&1 | tee test-output.log
            fi
          else
            if [ -n "${{ inputs.extra_args }}" ]; then
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }} -- ${{ inputs.extra_args }} 2>&1 | tee test-output.log
            else
              xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run ${{ inputs.npm_script }} 2>&1 | tee test-output.log
            fi
          fi
      - name: Check email secrets
        if: always()
        id: check_email
        continue-on-error: true
        run: |
          echo "🔍 Checking for email secrets..."
          MISSING=""
          FOUND=""
          
          if [ -n "${{ secrets.SMTP_SERVER }}" ]; then
            FOUND="${FOUND}SMTP_SERVER "
          else
            MISSING="${MISSING}SMTP_SERVER "
          fi
          
          if [ -n "${{ secrets.SMTP_PORT }}" ]; then
            FOUND="${FOUND}SMTP_PORT "
          else
            MISSING="${MISSING}SMTP_PORT "
          fi
          
          if [ -n "${{ secrets.SMTP_USERNAME }}" ]; then
            FOUND="${FOUND}SMTP_USERNAME "
          else
            MISSING="${MISSING}SMTP_USERNAME "
          fi
          
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            FOUND="${FOUND}SMTP_PASSWORD "
          else
            MISSING="${MISSING}SMTP_PASSWORD "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_TO }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_TO "
          else
            MISSING="${MISSING}ALERT_EMAIL_TO "
          fi
          
          if [ -n "${{ secrets.ALERT_EMAIL_FROM }}" ]; then
            FOUND="${FOUND}ALERT_EMAIL_FROM "
          else
            MISSING="${MISSING}ALERT_EMAIL_FROM "
          fi
          
          echo "Found secrets: ${FOUND:-none}"
          echo "Missing secrets: ${MISSING:-none}"
          
          if [ -n "$MISSING" ]; then
            echo "secrets_configured=false" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️ Email notification will be skipped. Missing secrets: $MISSING"
            echo ""
            echo "📋 To add secrets:"
            echo "   1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "   2. Click 'New repository secret'"
            echo "   3. Add each secret with EXACT name (case-sensitive):"
            echo "      - SMTP_SERVER = smtp.gmail.com"
            echo "      - SMTP_PORT = 587"
            echo "      - SMTP_USERNAME = your-email@gmail.com"
            echo "      - SMTP_PASSWORD = your-app-password (no spaces)"
            echo "      - ALERT_EMAIL_TO = recipient@example.com"
            echo "      - ALERT_EMAIL_FROM = your-email@gmail.com"
            echo ""
            echo "⚠️ Make sure secrets are in 'Repository secrets' (not Environment secrets)"
          else
            echo "secrets_configured=true" >> $GITHUB_OUTPUT
            echo "✅ All 6 email secrets are configured and ready"
          fi
      - name: Extract test console output
        if: always() && steps.check_email.outputs.secrets_configured == 'true'
        id: test_output
        continue-on-error: true
        run: |
          OUTPUT_FILE="test-output.log"
          if [ -f "$OUTPUT_FILE" ]; then
            echo "📋 Extracting test console output from $OUTPUT_FILE"

            # Extract key console output lines for any brand (PlanetF1, PlanetSportBet, StarSports, DragonBet, PlanetRugby, TeamTalk, etc.)
            # We use awk so that when we hit an interesting line (summary, broken link, etc.)
            # we also include the indented \"steps to recreate\" lines that follow it.
            TEST_OUTPUT=$(awk '
              BEGIN { lastInteresting = 0 }
              # Primary interesting lines (tabs, summaries, broken links/images, etc.)
              /(🚀|🔍|⏱️|✅|❌|🖼️|👤|👥|🏁|🔗|📋|Summary|TAB ===|RESULTS ===|FINAL|OVERALL|Broken links|Broken images|Drivers found|Testing Full Classification|Animation Check|Animation Detection|PlanetSportBet|Planet Rugby|StarSports|DragonBet|TeamTalk)/ {
                print;
                lastInteresting = NR;
                next;
              }
              # Indented follow-up lines (steps, Expected/Actual, numbered steps, etc.)
              (NR > lastInteresting && NR <= lastInteresting + 8 && $0 ~ /^[[:space:]]+(1\.|2\.|3\.|4\.|5\.|6\.|7\.|Expected|Actual|Impact|Look for a link|Navigate to:)/) {
                print;
                next;
              }
            ' "$OUTPUT_FILE" | head -500)

            # If that came back very short, fall back to the last 200 non-empty lines
            if [ -z "$TEST_OUTPUT" ] || [ ${#TEST_OUTPUT} -lt 50 ]; then
              TEST_OUTPUT=$(tail -n 200 "$OUTPUT_FILE" | grep -v '^[[:space:]]*$' | head -500)
            fi

            # Clean up: remove ANSI color codes and Playwright noise
            TEST_OUTPUT=$(echo "$TEST_OUTPUT" | \
              sed 's/\x1b\[[0-9;]*m//g' | \
              sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | \
              grep -v "Running.*tests using.*workers" | \
              grep -v "^\s*PASS\s" | \
              grep -v "^\s*FAIL\s" | \
              grep -v "^[[:space:]]*$" | \
              head -500)
            
            # Store in output (using multiline output)
            {
              echo 'test_console_output<<EOF'
              echo "$TEST_OUTPUT"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
            
            echo "✅ Extracted test output (${#TEST_OUTPUT} characters)"
            echo "Preview (first 25 lines):"
            echo "$TEST_OUTPUT" | head -25
          else
            echo "⚠️ Test output file not found at $OUTPUT_FILE"
            echo "test_console_output=Test output not available. Please check the workflow logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
      - name: Send email for selected run
        if: always() && steps.check_email.outputs.secrets_configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright Test (${{ inputs.npm_script || inputs.test_path }}) – ${{ job.status }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          secure: false
          content_type: text/plain
          body: |
            ${{ steps.test_output.outputs.test_console_output || 'Test output not available' }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
