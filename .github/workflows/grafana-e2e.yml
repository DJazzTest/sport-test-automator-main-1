name: E2E tests → Grafana Cloud

on:
  schedule:
    # Every 6 hours — adjust as needed
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/grafana-e2e.yml"

jobs:
  all-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all E2E tests and push metrics
        env:
          # Repository secrets — see .env.example for expected formats (no trailing newlines on token)
          GRAFANA_CLOUD_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_CLOUD_REMOTE_WRITE_URL }}
          GRAFANA_CLOUD_METRICS_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_METRICS_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          PROMETHEUS_JOB_NAME: sport-test-automator
          PROMETHEUS_INSTANCE: github-actions
        run: npm run test:grafana
        # Job may fail on assertions; reporter onEnd still pushes sport_e2e_* metrics

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            test-results-html/
