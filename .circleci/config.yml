version: 2.1

executors:
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.54.1-focal
    working_directory: ~/repo
    environment:
      NODE_ENV: test

commands:
  install_deps:
    description: "Install dependencies"
    steps:
      - restore_cache:
          keys:
            - v3-deps-{{ checksum "package-lock.json" }}
            - v3-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v3-deps-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps

  run_test:
    description: "Run a specific test file"
    parameters:
      test_file:
        type: string
    steps:
      - run:
          name: Run Test
          command: |
            echo "🚀 Starting test: << parameters.test_file >>"
            npx playwright test << parameters.test_file >> \
              --reporter=junit,line \
              --output=test-results/<< parameters.test_file >> \
              --workers=1
          no_output_timeout: 20m
      - store_test_results:
          path: test-results/<< parameters.test_file >>
      - store_artifacts:
          path: test-results/<< parameters.test_file >>
          destination: << parameters.test_file >>
      - store_artifacts:
          path: test-results-html/
          destination: test-results-html/
          when: always

jobs:
  setup:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - persist_to_workspace:
          root: .
          paths:
            - .

  planetsport_automation:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/tests/Planetsport-automation.spec.ts

  planetsportbet_cricket:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/tests/planetsportbet-cricket.spec.ts

  planetsportbet_football:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/tests/PlanetSportbet-football.spec.ts

  planetsportbet_tennis:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/tests/planetsportbet-tennis.spec.ts

  starsports_inplay:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/tests/starsports-all-InPlay-automationtest.spec.ts

  inplay_journey:
    executor: playwright
    steps:
      - checkout
      - install_deps
      - run_test:
          test_file: tests/inPlayJourney.spec.ts

workflows:
  version: 2
  test_suite:
    jobs:
      - setup
      - planetsport_automation:
          requires:
            - setup
      - planetsportbet_cricket:
          requires:
            - setup
      - planetsportbet_football:
          requires:
            - setup
      - planetsportbet_tennis:
          requires:
            - setup
      - starsports_inplay:
          requires:
            - setup
      - inplay_journey:
          requires:
            - setup
