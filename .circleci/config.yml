version: 2.1

jobs:
  test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.43.1-focal
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Install Playwright browsers
          command: npx playwright install
      - run:
          name: Run All Animation Widget Tests
          command: |
            echo "🚀 Starting All Animation Widget Tests"
            echo "Running StarSports All In-Play Test..."
            npx playwright test tests/tests/starsports-all-InPlay-automationtest.spec.ts --reporter=list --headed=false | tee -a test-output.log
            echo "Running PlanetSportBet Football Test..."
            npx playwright test tests/tests/PlanetSportbet-football.spec.ts --reporter=list --headed=false | tee -a test-output.log
            echo "Running PlanetSportBet Tennis Test..."
            npx playwright test tests/tests/planetsportbet-tennis.spec.ts --reporter=list --headed=false | tee -a test-output.log
            echo "Running PlanetSportBet Cricket Test..."
            npx playwright test tests/tests/planetsportbet-cricket.spec.ts --reporter=list --headed=false | tee -a test-output.log
            echo "📋 All test executions completed - check artifacts for detailed results"
      - run:
          name: Generate Test Summary Report
          command: |
            echo "# Sports Animation Widget Test Suite Summary" > test-summary.md
            echo "Generated on: $(date)" >> test-summary.md
            echo "" >> test-summary.md
            echo "## Test Output:" >> test-summary.md
            echo '```' >> test-summary.md
            cat test-output.log >> test-summary.md
            echo '```' >> test-summary.md
            echo "" >> test-summary.md
            echo "## Screenshots and Artifacts:" >> test-summary.md
            echo "Check the artifacts section for:" >> test-summary.md
            echo "- Screenshots of any test failures" >> test-summary.md
            echo "- Test execution logs and results" >> test-summary.md
            echo "- test-results-html/ - Detailed HTML test reports" >> test-summary.md
          when: always
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: test-results-html
          destination: test-results-html
      - store_artifacts:
          path: .
          destination: screenshots
          when: always
      - store_artifacts:
          path: test-summary.md
          destination: test-summary.md
          when: always
      - store_artifacts:
          path: test-output.log
          destination: test-output.log
          when: always
      - store_test_results:
          path: test-results
workflows:
  test:
    jobs:
      - test
