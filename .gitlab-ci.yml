image: mcr.microsoft.com/playwright:v1.54.1-jammy

stages:
  - test

variables:
  NPM_SCRIPT: "test:all"
  TEST_PATH: ""
  EXTRA_ARGS: ""

playwright:run:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  script:
    - npm ci
    - |
        if [ -n "$TEST_PATH" ]; then
          if [ -n "$EXTRA_ARGS" ]; then
            npx playwright test $TEST_PATH $EXTRA_ARGS
          else
            npx playwright test $TEST_PATH
          fi
        else
          if [ -n "$EXTRA_ARGS" ]; then
            npm run $NPM_SCRIPT -- $EXTRA_ARGS
          else
            npm run $NPM_SCRIPT
          fi
        fi
  artifacts:
    when: always
    paths:
      - playwright-report
    expire_in: 7 days
stages:
  - test

playwright_tests:
  image: mcr.microsoft.com/playwright:v1.47.2-jammy
  stage: test
  variables:
    NODE_ENV: production
    MAX_EVENTS: ${MAX_EVENTS:-10}
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npx playwright install --with-deps
    - npx playwright test --project=chromium
  artifacts:
    when: always
    paths:
      - test-results-html/
      - test-results/
    expire_in: 7 days

# Define the Docker image to use for the pipeline
image: mcr.microsoft.com/playwright:v1.54.1-jammy

# Define the stages of your pipeline
stages:
  - test
  - notify

# Cache Python and Node.js dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .venv/
    - __pycache__/
    - "*.pyc"
    - node_modules/
    - ~/.cache/ms-playwright/

# Input variables for manual pipeline
variables:
  TEST_TARGET: "all"  # Default to all tests
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DEFAULT_TIMEOUT: 60
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

# Common setup for all test jobs
.setup_playwright: &setup_playwright
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv
    - python3 --version
    - python3 -m pip install --upgrade pip
    - if [ -f "requirements.txt" ]; then python3 -m pip install -r requirements.txt; fi
    - npm install -g npm@latest
    - npm install -g @playwright/test@1.54.1
    - npx playwright install --with-deps
    - npx playwright install-deps

# Test job template
.test_template: &test_definition
  stage: test
  <<: *setup_playwright
  script:
    - echo "=== Starting $TEST_NAME Test ==="
    - echo "Node version: $(node --version)"
    - echo "npm version: $(npm --version)"
    - echo "Running test: $TEST_FILE"
    - mkdir -p test-results
    - |
      if [[ "$TEST_TARGET" == "all" ]]; then
        npx playwright test --reporter=junit,line --output test-results/junit.xml || true
      else
        npx playwright test "$TEST_TARGET" --reporter=junit,line --output test-results/junit.xml || true
      fi
    - python3 scripts/send_email.py test-results/junit.xml $CI_JOB_STATUS
    - echo "=== Test Results ==="
    - if [ -f "test-results/junit.xml" ]; then cat test-results/junit.xml; else echo "No test results file found"; fi
  artifacts:
    when: always
    paths:
      - test-results/
      - test-results-html/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# Individual test jobs
planetsport_automation:
  <<: *test_definition
  variables:
    TEST_NAME: "Planetsport Automation"
    TEST_FILE: "tests/e2e/planetsportgroup/automation.spec.ts"

planetsportbet_cricket:
  <<: *test_definition
  variables:
    TEST_NAME: "PlanetSportBet Cricket"
    TEST_FILE: "tests/e2e/planetsportgroup/cricket.spec.ts"

planetsportbet_football:
  <<: *test_definition
  variables:
    TEST_NAME: "PlanetSportBet Football"
    TEST_FILE: "tests/e2e/planetsportgroup/football.spec.ts"

planetsportbet_tennis:
  <<: *test_definition
  variables:
    TEST_NAME: "PlanetSportBet Tennis"
    TEST_FILE: "tests/e2e/planetsportgroup/tennis.spec.ts"

planetsport_animation:
  <<: *test_definition
  variables:
    TEST_NAME: "PlanetSport Animation"
    TEST_FILE: "tests/e2e/planetsportgroup/animation-widget.spec.ts"

starsports_all_inplay:
  <<: *test_definition
  variables:
    TEST_NAME: "StarSports All InPlay"
    TEST_FILE: "tests/e2e/starsports/inplay-automation.spec.ts"

teamtalk_website:
  <<: *test_definition
  variables:
    TEST_NAME: "TeamTalk Website"
    TEST_FILE: "tests/e2e/teamtalk/website.spec.ts"

common_navigation:
  <<: *test_definition
  variables:
    TEST_NAME: "Common Navigation"
    TEST_FILE: "tests/e2e/common/navigation.spec.ts"

# Notification job
send_email:
  stage: notify
  image: python:3.9-slim
  needs: ["test"]
  script:
    - apt-get update && apt-get install -y python3-pip
    - pip install -r requirements.txt
    - python3 scripts/send_email.py test-results/junit.xml $CI_JOB_STATUS
  only:
    - main  # Only run for main branch
  when: always  # Run even if tests fail

# Install dependencies
before_script:
  - apt-get update && apt-get install -y python3 python3-pip python3-venv
  - python3 --version
  - python3 -m pip install --upgrade pip
  - if [ -f "requirements.txt" ]; then python3 -m pip install -r requirements.txt; fi
  - npm install -g npm@latest
  - npm install -g @playwright/test@1.54.1

# Test stage
playwright_tests:
  stage: test
  script: |
    echo "=== Starting Test Process ==="
    echo "Node version: $(node --version)"
    echo "npm version: $(npm --version)"
    echo "Python version: $(python3 --version)"
    echo "Current directory: $(pwd)"
    echo -e "\n=== Directory Structure ==="
    find . -type d -not -path "*/node_modules/*" | sort
    echo -e "\n=== Test Files ==="
    find . -name "*.spec.ts" -o -name "*.test.ts" -o -name "*.spec.js" -o -name "*.test.js" | sort
    echo -e "\n=== Installing Dependencies ==="
    npx playwright install
    npx playwright install-deps
    echo -e "\n=== Running Tests ==="
    mkdir -p test-results
    # Create test-results directory
    mkdir -p test-results
    
    # First run tests with list reporter to see what's found
    npx playwright test --list || true
    
    # Create a clean test results directory
    rm -rf test-results/*
    
    # Run tests with JUnit reporter to a temporary file
    npx playwright test --reporter=junit,line --output test-results/playwright-results.xml || true
    
    # Create or use the test results file
    if [ -f "test-results/playwright-results.xml" ]; then
      # If Playwright created a file, use it
      mv test-results/playwright-results.xml test-results/junit.xml
    else
      # Otherwise create an empty test suite
      echo '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > test-results/junit.xml
    fi
    
    # Verify the file was created
    echo "=== Test Results Directory Contents ==="
    ls -la test-results/
    echo -e "\n=== Test Results File Content ==="
    cat test-results/junit.xml || echo "No test results file found"
  artifacts:
    when: always
    paths:
      - test-results/junit.xml
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week
